name: RHD LifeCore Public Download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon PBOs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-public package dist
          mkdir -p build-public
          python3 tools/pbo_pack.py addons/rhd_lifecore build-public/rhd_rhd_lifecore.pbo
          python3 tools/pbo_pack.py addons/rhd_clothing build-public/rhd_rhd_clothing.pbo

      - name: Build Altis multiplayer mission PBO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-public/mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-public/mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-public/mission/RHD_LifeCore.Altis build-public/RHD_LifeCore.Altis.pbo

      - name: Assemble @RHD-Life-Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/@RHD-Life-Core/addons
          mkdir -p package/@RHD-Life-Core/Missions
          mkdir -p package/@RHD-Life-Core/mpmissions
          mkdir -p package/@RHD-Life-Core/assets/branding
          mkdir -p package/@RHD-Life-Core/docs

          cp build-public/rhd_rhd_lifecore.pbo package/@RHD-Life-Core/addons/
          cp build-public/rhd_rhd_clothing.pbo package/@RHD-Life-Core/addons/
          cp build-public/RHD_LifeCore.Altis.pbo package/@RHD-Life-Core/Missions/
          cp -r mission-template/RHD_LifeCore.TEMPLATE package/@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis
          cp mod.cpp package/@RHD-Life-Core/
          cp meta.cpp package/@RHD-Life-Core/
          cp assets/branding/RHDLifeCore.jpg package/@RHD-Life-Core/assets/branding/

          for f in README.md 3DEN_SETUP.md 3DEN_MODULES.md EDITOR_QUICKSTART.md ADDON_BUILD.md ADMIN_AND_ACE_SETUP.md CTAB_INTEGRATION.md ANTISTASI_BASE.md STEAM_WORKSHOP_DEPENDENCIES.md STEAM_WORKSHOP_REQUIRED_ITEMS.txt THIRD_PARTY_NOTICES.md PERFORMANCE.md UI_REFERENCES.md; do
            test -f "$f"
            cp "$f" package/@RHD-Life-Core/docs/
          done

          cat > package/@RHD-Life-Core/INSTALL.txt <<'EOF'
RHD - LifeCore | Public Plug-and-Play Package

Required Workshop mods:
CBA_A3             450814997
cTab+               2262006564
Antistasi Ultimate  3020755032

Optional:
ACE3

1. Extract @RHD-Life-Core intact.
2. Add it to Arma 3 Launcher as a Local Mod.
3. Enable CBA_A3, cTab+, Antistasi Ultimate and RHD - LifeCore.
4. Host RHD_LifeCore.Altis from Multiplayer.
EOF

          mkdir -p dist
          cd package
          zip -qr ../dist/RHD-Life-Core-Launcher-Package.zip @RHD-Life-Core
          cd ..

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/RHD-Life-Core-Launcher-Package.zip
          unzip -t dist/RHD-Life-Core-Launcher-Package.zip >/dev/null
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_lifecore.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_clothing.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/Missions/RHD_LifeCore.Altis.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis/description.ext'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis/core/ui/ctab.hpp'

      - name: Upload GitHub Actions download
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Launcher-Package
          path: dist/RHD-Life-Core-Launcher-Package.zip
          if-no-files-found: error

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/RHD-Life-Core-Launcher-Package.zip \
            --title 'RHD - LifeCore | Latest' \
            --notes $'Latest verified @RHD-Life-Core package.\n\nRequired: CBA_A3, cTab+, Antistasi Ultimate. ACE3 optional.\n\nExtract @RHD-Life-Core and import it into Arma 3 Launcher as a Local Mod.' \
            --target "$GITHUB_SHA"
