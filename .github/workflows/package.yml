name: RHD LifeCore Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f addons/rhd_lifecore/config.cpp
          test -f addons/rhd_lifecore/\$PBOPREFIX\$
          test -f addons/rhd_clothing/config.cpp
          test -f addons/rhd_clothing/\$PBOPREFIX\$
          test -f addons/rhd_lifecore/functions/modules/fn_moduleLifeCoreAntistasi.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_moduleAntistasiBase.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_moduleLifeCore.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_dynamicLocations.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_dynamicLocationSync.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_terrainAudit.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_terrainFallback.sqf
          test -f addons/rhd_lifecore/functions/runtime/fn_runtimeInit.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/description.ext
          test -f mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
          test -f mission-template/RHD_LifeCore.TEMPLATE/initServer.sqf
          test -f tools/pbo_pack.py
          test -f mod.cpp
          test -f meta.cpp
          test -f assets/branding/RHDLifeCore.jpg
          test -f STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq 'requiredAddons[] = {"cba_main", "ctab_core", "A3A_core", "A3_Modules_F"};' addons/rhd_lifecore/config.cpp
          grep -Fq 'class moduleLifeCoreAntistasi {};' addons/rhd_lifecore/config.cpp
          grep -Fq 'class RHD_Module_LifeCoreAntistasi: Module_F' addons/rhd_lifecore/config.cpp
          grep -Fq 'RHD_LIFECORE_CONTROLLER_READY' addons/rhd_lifecore/functions/runtime/fn_runtimeInit.sqf
          grep -Fq 'RHD_LIFECORE_CONTROLLER_READY' addons/rhd_lifecore/functions/modules/fn_moduleLifeCoreAntistasi.sqf
          grep -Fq 'RHD_DYNAMIC_LOCATIONS_ENABLE' core/fn_init.sqf
          grep -Fq 'RHD_A3A_REQUIRED", true' core/fn_init.sqf
          grep -Fq '450814997' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '2262006564' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '3020755032' STEAM_WORKSHOP_REQUIRED_ITEMS.txt

          # The addon PBO must contain no inheritance from global Rsc* controls.
          ! grep -Eq ':[[:space:]]*Rsc(StructuredText|Text|Listbox|Button|Edit|Combo)[[:space:]]*[{]' addons/rhd_lifecore/config.cpp
          ! grep -Eq ':[[:space:]]*Rsc(StructuredText|RscText|RscListbox|RscButton|RscEdit|RscCombo)[[:space:]]*[{]' addons/rhd_lifecore/config.cpp
          ! grep -Eq ':[[:space:]]*Rsc(StructuredText|Text|Listbox|Button|Edit|Combo)[[:space:]]*[{]' addons/rhd_lifecore/core/ui/ctab.hpp

      - name: Build addon PBOs with repository packer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-addon
          mkdir -p build-addon
          python3 tools/pbo_pack.py addons/rhd_lifecore build-addon/rhd_rhd_lifecore.pbo
          python3 tools/pbo_pack.py addons/rhd_clothing build-addon/rhd_rhd_clothing.pbo
          test -s build-addon/rhd_rhd_lifecore.pbo
          test -s build-addon/rhd_rhd_clothing.pbo

      - name: Validate PBO directory headers and payload sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for path in [Path('build-addon/rhd_rhd_lifecore.pbo'), Path('build-addon/rhd_rhd_clothing.pbo')]:
              data = path.read_bytes()
              pos = 0
              total_payload = 0
              entries = 0
              while True:
                  end = data.find(b'\0', pos)
                  if end < 0 or end + 21 > len(data):
                      raise SystemExit(f'{path}: invalid PBO directory')
                  name = data[pos:end].decode('utf-8')
                  pos = end + 1
                  fields = struct.unpack('<IIIII', data[pos:pos + 20])
                  pos += 20
                  if name == '':
                      if fields != (0, 0, 0, 0, 0):
                          raise SystemExit(f'{path}: invalid PBO terminator {fields}')
                      break
                  total_payload += fields[4]
                  entries += 1
              if entries == 0 or pos + total_payload != len(data):
                  raise SystemExit(f'{path}: PBO size validation failed')
              print(f'{path}: valid PBO entries={entries} bytes={len(data)}')
          PY

      - name: Validate LifeCore PBO config safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          data = Path('build-addon/rhd_rhd_lifecore.pbo').read_bytes()
          required = [
              b'config.cpp', b'$PBOPREFIX$',
              b'fn_moduleLifeCoreAntistasi.sqf',
              b'class RHD_Module_LifeCoreAntistasi: Module_F',
              b'RHD_LIFECORE_CONTROLLER_READY',
              b'functions/modules/fn_dynamicLocations.sqf',
          ]
          missing = [x.decode('utf-8') for x in required if x not in data]
          if missing:
              raise SystemExit('LifeCore PBO missing: ' + ', '.join(missing))
          forbidden = [
              b': RscStructuredText {', b':RscStructuredText {',
              b': RscText {', b':RscListbox {', b': RscButton {',
              b': RscEdit {', b': RscCombo {'
          ]
          bad = [x.decode('utf-8') for x in forbidden if x in data]
          if bad:
              raise SystemExit('LifeCore PBO still contains forbidden global UI inheritance: ' + ', '.join(bad))
          print('LifeCore PBO config safety checks passed.')
          PY

      - name: Build bundled Altis mission PBO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mission
          mkdir -p build-mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-mission/RHD_LifeCore.Altis RHD_LifeCore.Altis.pbo
          test -s RHD_LifeCore.Altis.pbo

      - name: Validate bundled Altis scenario PBO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          path = Path('RHD_LifeCore.Altis.pbo')
          data = path.read_bytes()
          pos = 0
          total_payload = 0
          entries = 0
          while True:
              end = data.find(b'\0', pos)
              if end < 0 or end + 21 > len(data):
                  raise SystemExit('Altis PBO: invalid directory')
              name = data[pos:end].decode('utf-8')
              pos = end + 1
              fields = struct.unpack('<IIIII', data[pos:pos + 20])
              pos += 20
              if name == '':
                  if fields != (0, 0, 0, 0, 0):
                      raise SystemExit(f'Altis PBO: invalid PBO terminator {fields}')
                  break
              total_payload += fields[4]
              entries += 1
          if entries == 0 or pos + total_payload != len(data):
              raise SystemExit('Altis PBO: size validation failed')
          required = [b'description.ext', b'mission.sqm', b'RHD_DYNAMIC_LOCATIONS_ENABLE']
          missing = [x.decode('utf-8') for x in required if x not in data]
          if missing:
              raise SystemExit('Altis mission missing: ' + ', '.join(missing))
          print(f'Altis PBO valid entries={entries} bytes={len(data)}')
          PY

      - name: Assemble Launcher-ready @RHD-Life-Core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package/@RHD-Life-Core/addons
          mkdir -p package/@RHD-Life-Core/Missions
          mkdir -p package/@RHD-Life-Core/mpmissions
          mkdir -p package/@RHD-Life-Core/assets/branding
          mkdir -p package/@RHD-Life-Core/docs

          cp build-addon/rhd_rhd_lifecore.pbo package/@RHD-Life-Core/addons/
          cp build-addon/rhd_rhd_clothing.pbo package/@RHD-Life-Core/addons/
          cp RHD_LifeCore.Altis.pbo package/@RHD-Life-Core/Missions/
          cp -r mission-template/RHD_LifeCore.TEMPLATE package/@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis
          cp mod.cpp package/@RHD-Life-Core/
          cp meta.cpp package/@RHD-Life-Core/
          cp assets/branding/RHDLifeCore.jpg package/@RHD-Life-Core/assets/branding/

          docs=(README.md 3DEN_SETUP.md 3DEN_MODULES.md EDITOR_QUICKSTART.md ADDON_BUILD.md ADMIN_AND_ACE_SETUP.md CTAB_INTEGRATION.md ANTISTASI_BASE.md STEAM_WORKSHOP_DEPENDENCIES.md STEAM_WORKSHOP_REQUIRED_ITEMS.txt THIRD_PARTY_NOTICES.md PERFORMANCE.md UI_REFERENCES.md)
          for file in "${docs[@]}"; do cp "$file" package/@RHD-Life-Core/docs/; done

          cat > package/@RHD-Life-Core/INSTALL.txt <<'EOF'
RHD - LifeCore | Plug-and-Play Arma 3 Launcher Package

REQUIRED WORKSHOP MODS
CBA_A3             450814997
cTab+               2262006564
Antistasi Ultimate  3020755032

OPTIONAL MOD
ACE3

MASTER 3DEN MODULE
For native Antistasi Ultimate missions, place ONE:
RHD - LifeCore | Master Life RP + Antistasi Ultimate

That single module controls the RHD Life RP systems and the RHD/A3A bridge.
Do not place the two legacy RHD bridge/Life modules in a new mission.

LOCAL INSTALL
1. Delete any previous @RHD-Life-Core folder.
2. Extract this package intact.
3. Add the extracted @RHD-Life-Core folder to Arma 3 Launcher as a Local Mod.
4. Enable CBA_A3, cTab+, Antistasi Ultimate and RHD - LifeCore.
5. Open the Antistasi Ultimate mission in Eden and place the master module.
6. Save the mission and host it normally.

DYNAMIC LOCATION SYSTEM
RHD reads Antistasi Ultimate control/campaign state first, then falls back to
terrain discovery for generic locations. Antistasi remains authoritative for
its strategic engine, while RHD owns the Life RP/economy layer.
EOF

          mkdir -p dist
          cd package
          zip -qr ../dist/RHD-Life-Core-Launcher-Package.zip @RHD-Life-Core
          cd ..

      - name: Verify final Launcher package layout
        shell: bash
        run: |
          set -euo pipefail
          test -s package/@RHD-Life-Core/addons/rhd_rhd_lifecore.pbo
          test -s package/@RHD-Life-Core/addons/rhd_rhd_clothing.pbo
          test -s package/@RHD-Life-Core/Missions/RHD_LifeCore.Altis.pbo
          test -f package/@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis/description.ext
          test -f package/@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis/mission.sqm
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_lifecore.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_clothing.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis/description.ext'
          echo 'Final Launcher package layout validated.'

      - name: Upload Launcher package ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Launcher-Package
          path: dist/RHD-Life-Core-Launcher-Package.zip
          if-no-files-found: error

      - name: Upload raw Launcher mod folder
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-LauncherMod
          path: package/@RHD-Life-Core
          if-no-files-found: error

      - name: Upload addon PBOs
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Addon-PBOs
          path: build-addon/*.pbo
          if-no-files-found: error

      - name: Upload bundled Altis mission PBO
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Altis-Mission
          path: RHD_LifeCore.Altis.pbo
          if-no-files-found: error
