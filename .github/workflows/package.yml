name: RHD LifeCore Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f addons/rhd_lifecore/config.cpp
          test -f addons/rhd_lifecore/\$PBOPREFIX\$
          test -f addons/rhd_clothing/config.cpp
          test -f addons/rhd_clothing/\$PBOPREFIX\$
          test -f addons/rhd_lifecore/functions/modules/fn_moduleAntistasiBase.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_moduleLifeCore.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_terrainAudit.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_terrainFallback.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/description.ext
          test -f mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
          test -f tools/pbo_pack.py
          test -f mod.cpp
          test -f meta.cpp
          test -f assets/branding/RHDLifeCore.jpg
          test -f STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq 'requiredAddons[] = {"cba_main", "ctab_core", "A3A_core"};' addons/rhd_lifecore/config.cpp
          ! grep -Fq '"ace_main"' addons/rhd_lifecore/config.cpp
          grep -Fq '450814997' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '2262006564' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '3020755032' STEAM_WORKSHOP_REQUIRED_ITEMS.txt

      - name: Build addon PBOs with repository packer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-addon
          mkdir -p build-addon
          python3 tools/pbo_pack.py addons/rhd_lifecore build-addon/rhd_rhd_lifecore.pbo
          python3 tools/pbo_pack.py addons/rhd_clothing build-addon/rhd_rhd_clothing.pbo
          test -s build-addon/rhd_rhd_lifecore.pbo
          test -s build-addon/rhd_rhd_clothing.pbo

      - name: Validate addon PBO payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'build-addon/rhd_rhd_lifecore.pbo': [
                  b'config.cpp', b'$PBOPREFIX$',
                  b'functions/modules/fn_moduleAntistasiBase.sqf',
                  b'functions/modules/fn_moduleLifeCore.sqf',
                  b'functions/modules/fn_terrainAudit.sqf',
                  b'functions/modules/fn_terrainFallback.sqf',
              ],
              'build-addon/rhd_rhd_clothing.pbo': [
                  b'config.cpp', b'$PBOPREFIX$', b'RHD_Outfit_Tactical_Black',
              ],
          }
          for filename, required in checks.items():
              data = Path(filename).read_bytes()
              missing = [x.decode('utf-8') for x in required if x not in data]
              if missing:
                  raise SystemExit(f'{filename} missing: {missing}')
          print('Addon PBO validation passed.')
          PY

      - name: Build bundled Altis mission PBO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mission
          mkdir -p build-mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-mission/RHD_LifeCore.Altis RHD_LifeCore.Altis.pbo
          test -s RHD_LifeCore.Altis.pbo

      - name: Validate bundled Altis scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          data = Path('RHD_LifeCore.Altis.pbo').read_bytes()
          required = [
              b'description.ext', b'mission.sqm', b'initServer.sqf',
              b'initPlayerLocal.sqf', b'onPlayerRespawn.sqf', b'core/fn_init.sqf',
              b'RHD_Module_AntistasiBase', b'RHD_Module_LifeCore', b'rhd_shop_kavala'
          ]
          missing = [x.decode('utf-8') for x in required if x not in data]
          if missing:
              raise SystemExit('Altis mission PBO missing: ' + ', '.join(missing))
          print('Bundled Altis mission validation passed.')
          PY

      - name: Assemble Launcher-ready @RHD-LifeCore
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package/@RHD-LifeCore/addons
          mkdir -p package/@RHD-LifeCore/Missions
          mkdir -p package/@RHD-LifeCore/assets/branding
          mkdir -p package/@RHD-LifeCore/docs

          cp build-addon/rhd_rhd_lifecore.pbo package/@RHD-LifeCore/addons/
          cp build-addon/rhd_rhd_clothing.pbo package/@RHD-LifeCore/addons/
          cp RHD_LifeCore.Altis.pbo package/@RHD-LifeCore/Missions/
          cp mod.cpp package/@RHD-LifeCore/
          cp meta.cpp package/@RHD-LifeCore/
          cp assets/branding/RHDLifeCore.jpg package/@RHD-LifeCore/assets/branding/

          docs=(
            README.md
            3DEN_SETUP.md
            3DEN_MODULES.md
            EDITOR_QUICKSTART.md
            ADDON_BUILD.md
            ADMIN_AND_ACE_SETUP.md
            CTAB_INTEGRATION.md
            ANTISTASI_BASE.md
            STEAM_WORKSHOP_DEPENDENCIES.md
            STEAM_WORKSHOP_REQUIRED_ITEMS.txt
            THIRD_PARTY_NOTICES.md
            PERFORMANCE.md
            UI_REFERENCES.md
          )
          for file in "${docs[@]}"; do cp "$file" package/@RHD-LifeCore/docs/; done

          cat > package/@RHD-LifeCore/INSTALL.txt <<'EOF'
RHD - LifeCore | Plug-and-Play Arma 3 Launcher Package

REQUIRED WORKSHOP MODS
CBA_A3             450814997
cTab+               2262006564
Antistasi Ultimate  3020755032

OPTIONAL MOD
ACE3

LOCAL INSTALL
1. Extract the package and keep the @RHD-LifeCore folder intact.
2. Put @RHD-LifeCore beside your Arma 3 installation.
3. Open Arma 3 Launcher and add/import @RHD-LifeCore as a Local Mod.
4. Enable CBA_A3, cTab+, Antistasi Ultimate and RHD - LifeCore.
5. Launch the bundled RHD_LifeCore.Altis scenario.

The bundled Altis scenario already contains the RHD LifeCore and Antistasi
Ultimate bridge modules plus RHD economy/service markers. No 3DEN setup is
required for the bundled scenario.
EOF

          mkdir -p dist
          cd package
          zip -qr ../dist/RHD-LifeCore-Launcher-Package.zip @RHD-LifeCore
          cd ..

      - name: Verify final Launcher package
        shell: bash
        run: |
          set -euo pipefail
          test -s package/@RHD-LifeCore/addons/rhd_rhd_lifecore.pbo
          test -s package/@RHD-LifeCore/addons/rhd_rhd_clothing.pbo
          test -s package/@RHD-LifeCore/Missions/RHD_LifeCore.Altis.pbo
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/addons/rhd_rhd_lifecore.pbo'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/addons/rhd_rhd_clothing.pbo'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/Missions/RHD_LifeCore.Altis.pbo'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/mod.cpp'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/meta.cpp'
          echo 'Final Launcher package layout validated.'

      - name: Upload Launcher package ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Launcher-Package
          path: dist/RHD-LifeCore-Launcher-Package.zip
          if-no-files-found: error

      - name: Upload raw Launcher mod folder
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-LauncherMod
          path: package/@RHD-LifeCore
          if-no-files-found: error

      - name: Upload addon PBOs
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Addon-PBOs
          path: build-addon/*.pbo
          if-no-files-found: error

      - name: Upload bundled Altis mission PBO
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Altis-Mission
          path: RHD_LifeCore.Altis.pbo
          if-no-files-found: error
