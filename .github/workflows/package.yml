name: RHD LifeCore Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f addons/rhd_lifecore/config.cpp
          test -f addons/rhd_lifecore/\$PBOPREFIX\$
          test -f addons/rhd_clothing/config.cpp
          test -f addons/rhd_clothing/\$PBOPREFIX\$
          test -f addons/rhd_lifecore/functions/modules/fn_moduleAntistasiBase.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_moduleLifeCore.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_terrainAudit.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_terrainFallback.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/description.ext
          test -f mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
          test -f tools/pbo_pack.py
          test -f mod.cpp
          test -f meta.cpp
          test -f assets/branding/RHDLifeCore.jpg
          test -f STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq 'requiredAddons[] = {"cba_main", "ctab_core", "A3A_core"};' addons/rhd_lifecore/config.cpp
          ! grep -Fq '"ace_main"' addons/rhd_lifecore/config.cpp
          grep -Fq '450814997' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '2262006564' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '3020755032' STEAM_WORKSHOP_REQUIRED_ITEMS.txt

      - name: Build addon PBOs with repository packer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-addon
          mkdir -p build-addon
          python3 tools/pbo_pack.py addons/rhd_lifecore build-addon/rhd_rhd_lifecore.pbo
          python3 tools/pbo_pack.py addons/rhd_clothing build-addon/rhd_rhd_clothing.pbo
          test -s build-addon/rhd_rhd_lifecore.pbo
          test -s build-addon/rhd_rhd_clothing.pbo

      - name: Validate PBO directory headers and payload sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          files = [
              Path('build-addon/rhd_rhd_lifecore.pbo'),
              Path('build-addon/rhd_rhd_clothing.pbo'),
          ]
          for path in files:
              data = path.read_bytes()
              pos = 0
              total_payload = 0
              entries = 0
              while True:
                  end = data.find(b'\0', pos)
                  if end < 0 or end + 1 + 20 > len(data):
                      raise SystemExit(f'{path}: invalid PBO directory')
                  name = data[pos:end].decode('utf-8')
                  pos = end + 1
                  fields = struct.unpack('<IIIII', data[pos:pos + 20])
                  pos += 20
                  if name == '':
                      if fields != (0, 0, 0, 0, 0):
                          raise SystemExit(f'{path}: invalid PBO terminator fields {fields}')
                      break
                  total_payload += fields[4]
                  entries += 1
              if pos + total_payload != len(data):
                  raise SystemExit(
                      f'{path}: payload mismatch: header={pos} payload={total_payload} file={len(data)}'
                  )
              if entries == 0:
                  raise SystemExit(f'{path}: no PBO entries found')
              print(f'{path}: valid PBO, entries={entries}, bytes={len(data)}')
          PY

      - name: Validate addon PBO contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'build-addon/rhd_rhd_lifecore.pbo': [
                  b'config.cpp', b'$PBOPREFIX$',
                  b'functions/modules/fn_moduleAntistasiBase.sqf',
                  b'functions/modules/fn_moduleLifeCore.sqf',
                  b'functions/modules/fn_terrainAudit.sqf',
                  b'functions/modules/fn_terrainFallback.sqf',
                  b'file = "functions/modules"',
              ],
              'build-addon/rhd_rhd_clothing.pbo': [
                  b'config.cpp', b'$PBOPREFIX$', b'RHD_Outfit_Tactical_Black',
              ],
          }
          for filename, required in checks.items():
              data = Path(filename).read_bytes()
              missing = [x.decode('utf-8') for x in required if x not in data]
              if missing:
                  raise SystemExit(f'{filename} missing: {missing}')
          print('Addon PBO content validation passed.')
          PY

      - name: Build bundled Altis mission PBO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mission
          mkdir -p build-mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-mission/RHD_LifeCore.Altis RHD_LifeCore.Altis.pbo
          test -s RHD_LifeCore.Altis.pbo

      - name: Validate bundled Altis scenario PBO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          path = Path('RHD_LifeCore.Altis.pbo')
          data = path.read_bytes()
          pos = 0
          total_payload = 0
          entries = 0
          while True:
              end = data.find(b'\0', pos)
              if end < 0 or end + 1 + 20 > len(data):
                  raise SystemExit('Altis PBO: invalid PBO directory')
              name = data[pos:end].decode('utf-8')
              pos = end + 1
              fields = struct.unpack('<IIIII', data[pos:pos + 20])
              pos += 20
              if name == '':
                  if fields != (0, 0, 0, 0, 0):
                      raise SystemExit(f'Altis PBO: invalid terminator fields {fields}')
                  break
              total_payload += fields[4]
              entries += 1
          if pos + total_payload != len(data):
              raise SystemExit('Altis PBO: payload/header mismatch')
          required = [
              b'description.ext', b'mission.sqm', b'initServer.sqf',
              b'initPlayerLocal.sqf', b'onPlayerRespawn.sqf', b'core/fn_init.sqf',
              b'RHD_Module_AntistasiBase', b'RHD_Module_LifeCore', b'rhd_shop_kavala'
          ]
          missing = [x.decode('utf-8') for x in required if x not in data]
          if missing:
              raise SystemExit('Altis mission PBO missing: ' + ', '.join(missing))
          print(f'Bundled Altis mission PBO valid, entries={entries}, bytes={len(data)}')
          PY

      - name: Assemble Launcher-ready @RHD-Life-Core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package/@RHD-Life-Core/addons
          mkdir -p package/@RHD-Life-Core/Missions
          mkdir -p package/@RHD-Life-Core/mpmissions
          mkdir -p package/@RHD-Life-Core/assets/branding
          mkdir -p package/@RHD-Life-Core/docs

          cp build-addon/rhd_rhd_lifecore.pbo package/@RHD-Life-Core/addons/
          cp build-addon/rhd_rhd_clothing.pbo package/@RHD-Life-Core/addons/
          cp RHD_LifeCore.Altis.pbo package/@RHD-Life-Core/Missions/
          cp RHD_LifeCore.Altis.pbo package/@RHD-Life-Core/mpmissions/
          cp mod.cpp package/@RHD-Life-Core/
          cp meta.cpp package/@RHD-LifeCore/ 2>/dev/null || cp meta.cpp package/@RHD-Life-Core/
          cp assets/branding/RHDLifeCore.jpg package/@RHD-Life-Core/assets/branding/

          docs=(
            README.md 3DEN_SETUP.md 3DEN_MODULES.md EDITOR_QUICKSTART.md
            ADDON_BUILD.md ADMIN_AND_ACE_SETUP.md CTAB_INTEGRATION.md
            ANTISTASI_BASE.md STEAM_WORKSHOP_DEPENDENCIES.md
            STEAM_WORKSHOP_REQUIRED_ITEMS.txt THIRD_PARTY_NOTICES.md
            PERFORMANCE.md UI_REFERENCES.md
          )
          for file in "${docs[@]}"; do cp "$file" package/@RHD-Life-Core/docs/; done

          cat > package/@RHD-Life-Core/INSTALL.txt <<'EOF'
RHD - LifeCore | Plug-and-Play Arma 3 Launcher Package

REQUIRED WORKSHOP MODS
CBA_A3             450814997
cTab+               2262006564
Antistasi Ultimate  3020755032

OPTIONAL MOD
ACE3

LOCAL INSTALL
1. Extract the package and keep the @RHD-Life-Core folder intact.
2. Put @RHD-Life-Core beside your Arma 3 installation.
3. In Arma 3 Launcher choose Local Mods and add the @RHD-Life-Core folder.
4. Enable CBA_A3, cTab+, Antistasi Ultimate and RHD - LifeCore.
5. The bundled mission is available as RHD_LifeCore.Altis in Multiplayer.

SERVER INSTALL
The same mod folder includes mpmissions/RHD_LifeCore.Altis.pbo for a server
that loads missions from the active mod path. If using a server profile with
an explicit -cfg/-profiles mission directory, copy the PBO to that server's
mpmissions directory as normal.

The bundled Altis scenario already contains the RHD LifeCore and Antistasi
Ultimate bridge modules and RHD economy/service markers.
EOF

          mkdir -p dist
          cd package
          zip -qr ../dist/RHD-Life-Core-Launcher-Package.zip @RHD-Life-Core
          cd ..

      - name: Verify final Launcher package layout
        shell: bash
        run: |
          set -euo pipefail
          test -s package/@RHD-Life-Core/addons/rhd_rhd_lifecore.pbo
          test -s package/@RHD-Life-Core/addons/rhd_rhd_clothing.pbo
          test -s package/@RHD-Life-Core/Missions/RHD_LifeCore.Altis.pbo
          test -s package/@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis.pbo
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_lifecore.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_clothing.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/Missions/RHD_LifeCore.Altis.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/mod.cpp'
          echo 'Final Launcher package layout validated.'

      - name: Upload Launcher package ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Launcher-Package
          path: dist/RHD-Life-Core-Launcher-Package.zip
          if-no-files-found: error

      - name: Upload raw Launcher mod folder
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-LauncherMod
          path: package/@RHD-Life-Core
          if-no-files-found: error

      - name: Upload addon PBOs
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Addon-PBOs
          path: build-addon/*.pbo
          if-no-files-found: error

      - name: Upload bundled Altis mission PBO
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Altis-Mission
          path: RHD_LifeCore.Altis.pbo
          if-no-files-found: error
