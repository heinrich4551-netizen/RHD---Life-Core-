name: Build RHD Workshop Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1

      - name: Validate repository and hard dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f description.ext
          test -f initServer.sqf
          test -f initPlayerLocal.sqf
          test -f onPlayerRespawn.sqf
          test -f core/fn_init.sqf
          test -f addons/rhd_lifecore/config.cpp
          test -f addons/rhd_clothing/config.cpp
          test -f mod.cpp
          test -f meta.cpp
          test -f STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          test -f mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
          test -f tools/pbo_pack.py

          grep -Fq 'requiredAddons[] = {"cba_main", "ctab_core", "A3A_core"};' addons/rhd_lifecore/config.cpp
          ! grep -Fq '"ace_main"' addons/rhd_lifecore/config.cpp
          grep -Fq 'RHD_A3A_REQUIRED", true' core/fn_init.sqf
          grep -Fq '3020755032' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '450814997' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '2262006564' STEAM_WORKSHOP_REQUIRED_ITEMS.txt

      - name: Check project
        run: hemtt check

      - name: Build addon PBOs
        run: hemtt build

      - name: Validate addon PBOs
        shell: bash
        run: |
          set -euo pipefail
          test -f .hemttout/build/addons/rhd_rhd_lifecore.pbo
          test -f .hemttout/build/addons/rhd_rhd_clothing.pbo

          for pbo in .hemttout/build/addons/*.pbo; do
            echo "Validating $pbo"
            if strings "$pbo" | grep -E '(^|/)README\\.md$|(^|/)version\\.hpp$'; then
              echo "ERROR: source-only documentation/header leaked into PBO: $pbo"
              exit 1
            fi
          done

      - name: Build bundled Altis mission PBO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mission
          mkdir -p build-mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-mission/RHD_LifeCore.Altis RHD_LifeCore.Altis.pbo
          test -s RHD_LifeCore.Altis.pbo
          mkdir -p .mission-pbo-validation
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHD_LifeCore.Altis.pbo').read_bytes()
          required = [b'description.ext', b'mission.sqm', b'initServer.sqf', b'core/fn_init.sqf']
          missing = [x for x in required if x not in p]
          if missing:
              raise SystemExit(f'Missing required mission entries: {missing}')
          print('Bundled Altis mission PBO structure validation passed.')
          PY

      - name: Assemble Workshop-ready mod folder
        shell: bash
        run: |
          set -euo pipefail

          rm -rf workshop-package
          mkdir -p workshop-package/@RHD-LifeCore/addons
          mkdir -p workshop-package/@RHD-LifeCore/Missions
          mkdir -p workshop-package/@RHD-LifeCore/docs
          mkdir -p workshop-package/@RHD-LifeCore/assets/branding

          # Compiled RHD addon payload.
          cp .hemttout/build/addons/*.pbo workshop-package/@RHD-LifeCore/addons/

          # Bundled playable Altis scenario as a mission PBO.
          cp RHD_LifeCore.Altis.pbo workshop-package/@RHD-LifeCore/Missions/

          # Launcher/Workshop metadata.
          cp mod.cpp workshop-package/@RHD-LifeCore/
          cp meta.cpp workshop-package/@RHD-LifeCore/

          # Public documentation.
          cp README.md workshop-package/@RHD-LifeCore/docs/
          cp 3DEN_SETUP.md workshop-package/@RHD-LifeCore/docs/
          cp 3DEN_MODULES.md workshop-package/@RHD-LifeCore/docs/
          cp EDITOR_QUICKSTART.md workshop-package/@RHD-LifeCore/docs/
          cp ADDON_BUILD.md workshop-package/@RHD-LifeCore/docs/
          cp ADMIN_AND_ACE_SETUP.md workshop-package/@RHD-LifeCore/docs/
          cp CTAB_INTEGRATION.md workshop-package/@RHD-LifeCore/docs/
          cp ANTISTASI_BASE.md workshop-package/@RHD-LifeCore/docs/
          cp STEAM_WORKSHOP_DEPENDENCIES.md workshop-package/@RHD-LifeCore/docs/
          cp STEAM_WORKSHOP_REQUIRED_ITEMS.txt workshop-package/@RHD-LifeCore/docs/
          cp THIRD_PARTY_NOTICES.md workshop-package/@RHD-LifeCore/docs/
          cp PERFORMANCE.md workshop-package/@RHD-LifeCore/docs/
          cp UI_REFERENCES.md workshop-package/@RHD-LifeCore/docs/

          # Mod artwork.
          cp assets/branding/RHDLifeCore.jpg workshop-package/@RHD-LifeCore/assets/branding/

          # Keep source available for server operators/developers.
          mkdir -p workshop-package/RHD-LifeCore-MissionSource.Altis/core
          mkdir -p workshop-package/RHD-LifeCore-MissionSource.Altis/assets
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. workshop-package/RHD-LifeCore-MissionSource.Altis/

          cp STEAM_WORKSHOP_REQUIRED_ITEMS.txt workshop-package/

          cat > workshop-package/INSTALL.txt <<'EOF'
RHD - LifeCore | Steam Workshop / Arma 3 Launcher Package
==========================================================

REQUIRED WORKSHOP ITEMS
-----------------------
CBA_A3              450814997
cTab+               2262006564
Antistasi Ultimate  3020755032

ACE3 is optional.

LOCAL LAUNCHER INSTALL
----------------------
Copy @RHD-LifeCore/ beside Arma 3 and add it as a local mod in the Arma 3
Launcher. Enable CBA_A3, cTab+, Antistasi Ultimate, and RHD - LifeCore.

BUNDLED ALTIS SCENARIO
----------------------
RHD_LifeCore.Altis.pbo is included in @RHD-LifeCore/Missions/. It is the
published RHD scenario and is built from the copy-ready Altis mission source.

DEDICATED SERVER
----------------
Place @RHD-LifeCore on the dedicated server and enable it with the three
required Workshop dependencies. The bundled mission is selected from the
server's mission list; do not copy a mission PBO into the addons directory.

WORKSHOP PUBLISHING
-------------------
Upload the @RHD-LifeCore folder as the RHD Workshop item. In Steam Workshop
set these as REQUIRED dependencies:

450814997  CBA_A3
2262006564 cTab+
3020755032 Antistasi Ultimate

Do not mark ACE3 as required.
EOF

          cd workshop-package
          zip -r ../RHD-LifeCore-Workshop.zip .

      - name: Upload Workshop package
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Workshop
          path: RHD-LifeCore-Workshop.zip
          if-no-files-found: error

      - name: Upload Launcher mod folder
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-LauncherMod
          path: workshop-package/@RHD-LifeCore
          if-no-files-found: error

      - name: Upload Altis mission PBO
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Altis-Mission
          path: RHD_LifeCore.Altis.pbo
          if-no-files-found: error

      - name: Upload Altis mission source
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Altis-MissionSource
          path: workshop-package/RHD-LifeCore-MissionSource.Altis
          if-no-files-found: error
