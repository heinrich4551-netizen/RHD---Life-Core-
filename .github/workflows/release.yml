name: RHD LifeCore Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/pbo_pack.py
          test -f addons/rhd_lifecore/config.cpp
          test -f addons/rhd_lifecore/\$PBOPREFIX\$
          test -f addons/rhd_clothing/config.cpp
          test -f addons/rhd_clothing/\$PBOPREFIX\$
          test -f addons/rhd_lifecore/functions/modules/fn_moduleAntistasiBase.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_moduleLifeCore.sqf
          test -f addons/rhd_lifecore/functions/modules/fn_dynamicLocations.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/description.ext
          test -f mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
          test -f mission-template/RHD_LifeCore.TEMPLATE/initServer.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/core/ui/ctab.hpp
          test -f mod.cpp
          test -f meta.cpp
          test -f assets/branding/RHDLifeCore.jpg
          grep -Fq 'requiredAddons[] = {"cba_main", "ctab_core", "A3A_core"};' addons/rhd_lifecore/config.cpp

      - name: Build addon PBOs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-release
          mkdir -p build-release
          python3 tools/pbo_pack.py addons/rhd_lifecore build-release/rhd_rhd_lifecore.pbo
          python3 tools/pbo_pack.py addons/rhd_clothing build-release/rhd_rhd_clothing.pbo

      - name: Build Altis multiplayer mission PBO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-release/mission
          mkdir -p build-release/mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-release/mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-release/mission/RHD_LifeCore.Altis build-release/RHD_LifeCore.Altis.pbo

      - name: Validate PBOs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          paths = [
              Path('build-release/rhd_rhd_lifecore.pbo'),
              Path('build-release/rhd_rhd_clothing.pbo'),
              Path('build-release/RHD_LifeCore.Altis.pbo'),
          ]

          for path in paths:
              data = path.read_bytes()
              pos = 0
              total_payload = 0
              entries = 0
              while True:
                  end = data.find(b'\0', pos)
                  if end < 0 or end + 21 > len(data):
                      raise SystemExit(f'{path}: invalid PBO directory')
                  name = data[pos:end].decode('utf-8')
                  pos = end + 1
                  fields = struct.unpack('<IIIII', data[pos:pos + 20])
                  pos += 20
                  if name == '':
                      if fields != (0, 0, 0, 0, 0):
                          raise SystemExit(f'{path}: invalid terminator {fields}')
                      break
                  total_payload += fields[4]
                  entries += 1
              if entries == 0 or pos + total_payload != len(data):
                  raise SystemExit(f'{path}: payload size mismatch')
              print(f'{path}: valid entries={entries} bytes={len(data)}')

          checks = {
              'build-release/rhd_rhd_lifecore.pbo': [
                  b'config.cpp',
                  b'functions/modules/fn_moduleAntistasiBase.sqf',
                  b'functions/modules/fn_moduleLifeCore.sqf',
                  b'functions/modules/fn_dynamicLocations.sqf',
              ],
              'build-release/rhd_rhd_clothing.pbo': [
                  b'config.cpp',
                  b'RHD_Outfit_Tactical_Black',
              ],
              'build-release/RHD_LifeCore.Altis.pbo': [
                  b'description.ext',
                  b'mission.sqm',
                  b'RHD_Module_AntistasiBase',
                  b'RHD_Module_LifeCore',
                  b'core/ui/ctab.hpp',
              ],
          }
          for filename, required in checks.items():
              data = Path(filename).read_bytes()
              missing = [x.decode('utf-8') for x in required if x not in data]
              if missing:
                  raise SystemExit(f'{filename}: missing {missing}')
          PY

      - name: Assemble @RHD-Life-Core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist package
          mkdir -p package/@RHD-Life-Core/addons
          mkdir -p package/@RHD-Life-Core/Missions
          mkdir -p package/@RHD-Life-Core/mpmissions
          mkdir -p package/@RHD-Life-Core/assets/branding
          mkdir -p package/@RHD-Life-Core/docs

          cp build-release/rhd_rhd_lifecore.pbo package/@RHD-Life-Core/addons/
          cp build-release/rhd_rhd_clothing.pbo package/@RHD-Life-Core/addons/
          cp build-release/RHD_LifeCore.Altis.pbo package/@RHD-Life-Core/Missions/
          cp -r mission-template/RHD_LifeCore.TEMPLATE package/@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis
          cp mod.cpp package/@RHD-Life-Core/
          cp meta.cpp package/@RHD-LifeCore/ 2>/dev/null || cp meta.cpp package/@RHD-Life-Core/
          cp assets/branding/RHDLifeCore.jpg package/@RHD-Life-Core/assets/branding/
          for f in README.md 3DEN_SETUP.md 3DEN_MODULES.md EDITOR_QUICKSTART.md ADDON_BUILD.md ADMIN_AND_ACE_SETUP.md CTAB_INTEGRATION.md ANTISTASI_BASE.md STEAM_WORKSHOP_DEPENDENCIES.md STEAM_WORKSHOP_REQUIRED_ITEMS.txt THIRD_PARTY_NOTICES.md PERFORMANCE.md UI_REFERENCES.md; do
            test -f "$f"
            cp "$f" package/@RHD-Life-Core/docs/
          done

          cat > package/@RHD-Life-Core/INSTALL.txt <<'EOF'
RHD - LifeCore | Plug-and-Play Launcher Package

Required Workshop mods:
- CBA_A3: 450814997
- cTab+: 2262006564
- Antistasi Ultimate: 3020755032

ACE3 is optional.

Install:
1. Extract @RHD-Life-Core intact.
2. Add @RHD-Life-Core to Arma 3 Launcher as a Local Mod.
3. Enable CBA_A3, cTab+, Antistasi Ultimate and RHD - LifeCore.
4. Host RHD_LifeCore.Altis from Multiplayer.

The package contains compiled addon PBOs and the bundled Altis multiplayer
mission. RHD locations are resolved dynamically from the active terrain and
Antistasi Ultimate campaign state.
EOF

          mkdir -p dist
          cd package
          zip -qr ../dist/RHD-Life-Core-Launcher-Package.zip @RHD-Life-Core
          cd ..

      - name: Final package validation
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/RHD-Life-Core-Launcher-Package.zip
          unzip -t dist/RHD-Life-Core-Launcher-Package.zip >/dev/null
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_lifecore.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/addons/rhd_rhd_clothing.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/Missions/RHD_LifeCore.Altis.pbo'
          unzip -l dist/RHD-Life-Core-Launcher-Package.zip | grep -Fq '@RHD-Life-Core/mpmissions/RHD_LifeCore.Altis/core/ui/ctab.hpp'

      - name: Upload persistent build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Launcher-Package
          path: dist/RHD-Life-Core-Launcher-Package.zip
          if-no-files-found: error

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/RHD-Life-Core-Launcher-Package.zip \
            --title 'RHD - LifeCore | Latest' \
            --notes $'Latest verified RHD - LifeCore Launcher package.\n\nRequired: CBA_A3, cTab+, Antistasi Ultimate.\nACE3 is optional.\n\nDownload the ZIP, extract @RHD-Life-Core, and import it into Arma 3 Launcher as a Local Mod.' \
            --target "$GITHUB_SHA"
