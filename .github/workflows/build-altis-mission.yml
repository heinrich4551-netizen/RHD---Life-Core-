name: Build RHD Altis Mission

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Altis mission source
        run: |
          set -euo pipefail
          test -f mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
          test -f mission-template/RHD_LifeCore.TEMPLATE/description.ext
          test -f mission-template/RHD_LifeCore.TEMPLATE/initServer.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/initPlayerLocal.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/onPlayerRespawn.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/core/fn_init.sqf

      - name: Build mission PBO
        run: |
          set -euo pipefail
          rm -rf build-mission
          mkdir -p build-mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-mission/RHD_LifeCore.Altis RHD_LifeCore.Altis.pbo
          test -s RHD_LifeCore.Altis.pbo

      - name: Validate mission PBO
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHD_LifeCore.Altis.pbo').read_bytes()
          required = [
              b'description.ext',
              b'mission.sqm',
              b'initServer.sqf',
              b'initPlayerLocal.sqf',
              b'onPlayerRespawn.sqf',
              b'core/fn_init.sqf',
          ]
          missing = [x.decode() for x in required if x not in p]
          if missing:
              raise SystemExit('Mission PBO missing: ' + ', '.join(missing))
          print('RHD_LifeCore.Altis.pbo validation passed')
          PY

      - name: Upload Altis mission PBO
        uses: actions/upload-artifact@v4
        with:
          name: RHD-Lifecore-Altis-Mission
          path: RHD_LifeCore.Altis.pbo
          if-no-files-found: error
