name: Build RHD LifeCore Plug-and-Play Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1

      - name: Validate published package contract
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            addons/rhd_lifecore/config.cpp
            addons/rhd_clothing/config.cpp
            mission-template/RHD_LifeCore.TEMPLATE/description.ext
            mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
            mission-template/RHD_LifeCore.TEMPLATE/initServer.sqf
            mission-template/RHD_LifeCore.TEMPLATE/initPlayerLocal.sqf
            mission-template/RHD_LifeCore.TEMPLATE/onPlayerRespawn.sqf
            mission-template/RHD_LifeCore.TEMPLATE/core/fn_init.sqf
            tools/pbo_pack.py
            mod.cpp
            meta.cpp
            STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          )
          for file in "${required_files[@]}"; do test -f "$file"; done

          grep -Fq 'requiredAddons[] = {"cba_main", "ctab_core", "A3A_core"};' addons/rhd_lifecore/config.cpp
          ! grep -Fq '"ace_main"' addons/rhd_lifecore/config.cpp
          grep -Fq '3020755032' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '450814997' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '2262006564' STEAM_WORKSHOP_REQUIRED_ITEMS.txt

      - name: Check addon project
        run: hemtt check

      - name: Build addon PBOs
        run: hemtt build

      - name: Validate compiled addons
        shell: bash
        run: |
          set -euo pipefail
          test -s .hemttout/build/addons/rhd_rhd_lifecore.pbo
          test -s .hemttout/build/addons/rhd_rhd_clothing.pbo

      - name: Build bundled Altis mission PBO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mission
          mkdir -p build-mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-mission/RHD_LifeCore.Altis RHD_LifeCore.Altis.pbo
          test -s RHD_LifeCore.Altis.pbo

      - name: Validate bundled Altis scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHD_LifeCore.Altis.pbo').read_bytes()
          required = [
              b'description.ext',
              b'mission.sqm',
              b'initServer.sqf',
              b'initPlayerLocal.sqf',
              b'onPlayerRespawn.sqf',
              b'core/fn_init.sqf',
              b'RHD_Module_AntistasiBase',
              b'RHD_Module_LifeCore',
              b'rhd_shop_kavala',
          ]
          missing = [name.decode() for name in required if name not in p]
          if missing:
              raise SystemExit('Mission PBO missing: ' + ', '.join(missing))
          print('Bundled Altis scenario structure validation passed.')
          PY

      - name: Assemble exact Launcher package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist workshop-package

          mkdir -p workshop-package/@RHD-LifeCore/addons
          mkdir -p workshop-package/@RHD-LifeCore/Missions
          mkdir -p workshop-package/@RHD-LifeCore/assets/branding
          mkdir -p workshop-package/@RHD-LifeCore/docs

          cp .hemttout/build/addons/rhd_rhd_lifecore.pbo workshop-package/@RHD-LifeCore/addons/
          cp .hemttout/build/addons/rhd_rhd_clothing.pbo workshop-package/@RHD-LifeCore/addons/
          cp RHD_LifeCore.Altis.pbo workshop-package/@RHD-LifeCore/Missions/
          cp mod.cpp workshop-package/@RHD-LifeCore/
          cp meta.cpp workshop-package/@RHD-LifeCore/
          cp assets/branding/RHDLifeCore.jpg workshop-package/@RHD-LifeCore/assets/branding/

          docs=(
            README.md
            3DEN_SETUP.md
            3DEN_MODULES.md
            EDITOR_QUICKSTART.md
            ADDON_BUILD.md
            ADMIN_AND_ACE_SETUP.md
            CTAB_INTEGRATION.md
            ANTISTASI_BASE.md
            STEAM_WORKSHOP_DEPENDENCIES.md
            STEAM_WORKSHOP_REQUIRED_ITEMS.txt
            THIRD_PARTY_NOTICES.md
            PERFORMANCE.md
            UI_REFERENCES.md
          )
          for doc in "${docs[@]}"; do cp "$doc" workshop-package/@RHD-LifeCore/docs/; done

          cat > workshop-package/@RHD-LifeCore/INSTALL.txt <<'EOF'
RHD - LifeCore | Plug-and-Play Arma 3 Launcher Package
=======================================================

REQUIRED WORKSHOP MODS
- CBA_A3 (450814997)
- cTab+ (2262006564)
- Antistasi Ultimate (3020755032)

OPTIONAL
- ACE3

LOCAL INSTALL
1. Extract this package so the folder named @RHD-LifeCore is beside your Arma 3 installation.
2. Open Arma 3 Launcher.
3. Use Local Mod and select @RHD-LifeCore.
4. Enable CBA_A3, cTab+, Antistasi Ultimate and RHD - LifeCore.
5. Start the included RHD_LifeCore.Altis mission.

The bundled Altis mission is already configured with the RHD LifeCore and
Antistasi Ultimate bridge modules and its RHD service/economy markers. No
3DEN placement is required to play the bundled scenario.

CUSTOM MISSIONS
Use mission-template/RHD_LifeCore.TEMPLATE as the 3DEN starting point when
building another terrain. The custom mission still requires the same three
Workshop dependencies.

WORKSHOP PUBLISHING
Upload/publish the @RHD-LifeCore folder as the RHD Workshop item. Steam
Workshop dependency relationships must be set to REQUIRED for the three
listed dependencies. ACE3 stays optional.
EOF

          cp workshop-package/@RHD-LifeCore/INSTALL.txt workshop-package/
          mkdir -p dist
          cd workshop-package
          zip -qr ../dist/RHD-LifeCore-Launcher-Package.zip @RHD-LifeCore INSTALL.txt
          cd ..

          # Verify the archive is actually importable as a local mod package.
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq ' @RHD-LifeCore/mod.cpp' || true
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/addons/rhd_rhd_lifecore.pbo'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/addons/rhd_rhd_clothing.pbo'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/Missions/RHD_LifeCore.Altis.pbo'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/mod.cpp'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/meta.cpp'
          unzip -l dist/RHD-LifeCore-Launcher-Package.zip | grep -Fq '@RHD-LifeCore/INSTALL.txt'

      - name: Upload plug-and-play Launcher package
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Launcher-Package
          path: dist/RHD-LifeCore-Launcher-Package.zip
          if-no-files-found: error

      - name: Upload raw @RHD-LifeCore folder
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-LauncherMod
          path: workshop-package/@RHD-LifeCore
          if-no-files-found: error

      - name: Upload bundled Altis mission PBO
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Altis-Mission
          path: RHD_LifeCore.Altis.pbo
          if-no-files-found: error
