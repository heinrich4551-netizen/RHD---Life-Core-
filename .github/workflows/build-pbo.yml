name: Build RHD Workshop Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          test -f addons/rhd_lifecore/config.cpp
          test -f addons/rhd_clothing/config.cpp
          test -f mission-template/RHD_LifeCore.TEMPLATE/description.ext
          test -f mission-template/RHD_LifeCore.TEMPLATE/mission.sqm
          test -f mission-template/RHD_LifeCore.TEMPLATE/initServer.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/initPlayerLocal.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/onPlayerRespawn.sqf
          test -f mission-template/RHD_LifeCore.TEMPLATE/core/fn_init.sqf
          test -f tools/pbo_pack.py
          test -f mod.cpp
          test -f meta.cpp
          test -f STEAM_WORKSHOP_REQUIRED_ITEMS.txt

          grep -Fq 'requiredAddons[] = {"cba_main", "ctab_core", "A3A_core"};' addons/rhd_lifecore/config.cpp
          ! grep -Fq '"ace_main"' addons/rhd_lifecore/config.cpp
          grep -Fq '3020755032' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '450814997' STEAM_WORKSHOP_REQUIRED_ITEMS.txt
          grep -Fq '2262006564' STEAM_WORKSHOP_REQUIRED_ITEMS.txt

      - name: Check addon project
        run: hemtt check

      - name: Build addon PBOs
        run: hemtt build

      - name: Validate addon PBOs
        shell: bash
        run: |
          set -euo pipefail
          test -s .hemttout/build/addons/rhd_rhd_lifecore.pbo
          test -s .hemttout/build/addons/rhd_rhd_clothing.pbo

          for pbo in .hemttout/build/addons/*.pbo; do
            if strings "$pbo" | grep -E '(^|/)README\\.md$|(^|/)version\\.hpp$'; then
              echo "ERROR: source-only documentation/header leaked into PBO: $pbo"
              exit 1
            fi
          done

      - name: Build bundled Altis scenario PBO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mission
          mkdir -p build-mission/RHD_LifeCore.Altis
          cp -r mission-template/RHD_LifeCore.TEMPLATE/. build-mission/RHD_LifeCore.Altis/
          python3 tools/pbo_pack.py build-mission/RHD_LifeCore.Altis RHD_LifeCore.Altis.pbo
          test -s RHD_LifeCore.Altis.pbo

          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHD_LifeCore.Altis.pbo').read_bytes()
          required = [
              b'description.ext',
              b'mission.sqm',
              b'initServer.sqf',
              b'initPlayerLocal.sqf',
              b'onPlayerRespawn.sqf',
              b'core/fn_init.sqf',
          ]
          missing = [name.decode() for name in required if name not in p]
          if missing:
              raise SystemExit(f'Mission PBO is missing: {missing}')
          print('Bundled Altis mission PBO structure validation passed.')
          PY

      - name: Assemble Launcher/Workshop package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf workshop-package
          mkdir -p workshop-package/@RHD-LifeCore/addons
          mkdir -p workshop-package/@RHD-LifeCore/Missions
          mkdir -p workshop-package/@RHD-LifeCore/docs
          mkdir -p workshop-package/@RHD-LifeCore/assets/branding

          cp .hemttout/build/addons/*.pbo workshop-package/@RHD-LifeCore/addons/
          cp RHD_LifeCore.Altis.pbo workshop-package/@RHD-LifeCore/Missions/
          cp mod.cpp workshop-package/@RHD-LifeCore/
          cp meta.cpp workshop-package/@RHD-LifeCore/
          cp assets/branding/RHDLifeCore.jpg workshop-package/@RHD-LifeCore/assets/branding/

          for doc in \
            README.md \
            3DEN_SETUP.md \
            3DEN_MODULES.md \
            EDITOR_QUICKSTART.md \
            ADDON_BUILD.md \
            ADMIN_AND_ACE_SETUP.md \
            CTAB_INTEGRATION.md \
            ANTISTASI_BASE.md \
            STEAM_WORKSHOP_DEPENDENCIES.md \
            STEAM_WORKSHOP_REQUIRED_ITEMS.txt \
            THIRD_PARTY_NOTICES.md \
            PERFORMANCE.md \
            UI_REFERENCES.md; do
            cp "$doc" workshop-package/@RHD-LifeCore/docs/
          done

          cp STEAM_WORKSHOP_REQUIRED_ITEMS.txt workshop-package/

          cat > workshop-package/INSTALL.txt <<'EOF'
RHD - LifeCore | Workshop / Arma 3 Launcher Package
====================================================

REQUIRED WORKSHOP DEPENDENCIES
------------------------------
CBA_A3              450814997
cTab+               2262006564
Antistasi Ultimate  3020755032

ACE3 is optional.

PACKAGE LAYOUT
--------------
@RHD-LifeCore/
  addons/
    rhd_rhd_lifecore.pbo
    rhd_rhd_clothing.pbo
  Missions/
    RHD_LifeCore.Altis.pbo
  mod.cpp
  meta.cpp

LOCAL LAUNCHER INSTALL
----------------------
Copy @RHD-LifeCore next to Arma 3 and add it to the Arma 3 Launcher as a local mod.
Enable CBA_A3, cTab+, Antistasi Ultimate and RHD - LifeCore.

WORKSHOP PUBLISHING
-------------------
Publish @RHD-LifeCore as the RHD Workshop mod.
Set these Steam Workshop dependencies to REQUIRED:

450814997  CBA_A3
2262006564 cTab+
3020755032 Antistasi Ultimate

Do not mark ACE3 as required.

The included RHD_LifeCore.Altis.pbo is the bundled Altis scenario.
EOF

          cd workshop-package
          zip -r ../RHD-LifeCore-Workshop.zip . >/dev/null

      - name: Upload complete Workshop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Workshop
          path: RHD-LifeCore-Workshop.zip
          if-no-files-found: error

      - name: Upload Launcher mod
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-LauncherMod
          path: workshop-package/@RHD-LifeCore
          if-no-files-found: error

      - name: Upload bundled Altis mission
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Altis-Mission
          path: RHD_LifeCore.Altis.pbo
          if-no-files-found: error

      - name: Upload addon PBOs
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-Addon-PBOs
          path: .hemttout/build/addons/*.pbo
          if-no-files-found: error
